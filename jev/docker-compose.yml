# docker compose up -d --build   (see docs/CLOUD.md)
services:
  jev:
    build: .
    restart: unless-stopped
    # The keys and settings. Copy .env.cloud.example to .env and fill it in. It stays on the server.
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    shm_size: 1gb
    # The dashboard. Published on the server's own loopback only, so it is not on the internet.
    # Reach it with: ssh -L 4545:localhost:4545 you@your-server   then open http://localhost:4545
    ports:
      - "127.0.0.1:4545:4545"
    # Time for the application in progress to finish when the container is stopped.
    stop_grace_period: 180s
    volumes:
      - jev-data:/app/data
      - jev-documents:/app/documents
      - jev-applications:/app/applications

volumes:
  jev-data:
  jev-documents:
  jev-applications:
